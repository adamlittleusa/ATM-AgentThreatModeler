name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run tests
        run: python tests/test_collector.py

      - name: Committed artifacts are in sync with the code
        run: |
          python -m atm checks > docs/checks.md
          python -m atm analyze samples/fixtures/support-agent -o samples/support-agent --html
          git diff --exit-code -- docs/checks.md samples/support-agent
